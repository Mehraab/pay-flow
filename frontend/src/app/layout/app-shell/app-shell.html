<aside class="rail">
  <div class="rail-head">
    <svg width="24" height="24" viewBox="0 0 26 26">
      <rect x="1" y="1" width="24" height="24" rx="7" fill="none" stroke="#7EA0FF" stroke-width="1.6" />
      <path
        d="M8 17 L13 8 L18 17"
        fill="none"
        stroke="#7EA0FF"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>PayFlow</span>
  </div>

  <app-role-switcher />
  <app-nav-rail />

  <div class="rail-foot">
    <div class="avatar">{{ roleLabel() === 'Operator' ? 'OP' : 'ME' }}</div>
    <div class="who">
      <b>{{ roleLabel() }}</b>
      <small>{{ identityLabel() }}</small>
    </div>
    <button
      class="signout-btn"
      type="button"
      [disabled]="signingOut()"
      [attr.aria-label]="signingOut() ? 'Signing out…' : 'Sign out'"
      [title]="signingOut() ? 'Signing out…' : 'Sign out'"
      (click)="signOut()"
    >
      <svg width="15" height="15" viewBox="0 0 15 15">
        <path
          d="M6 1.5 H2.5 A1 1 0 0 0 1.5 2.5 V12.5 A1 1 0 0 0 2.5 13.5 H6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M9.5 4.5 L13 8 L9.5 11.5 M13 8 H5.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
</aside>

<div class="shell">
  <app-header-bar />
  <main class="content">
    <router-outlet />
  </main>
</div>
