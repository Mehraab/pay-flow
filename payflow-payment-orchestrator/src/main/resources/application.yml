server:
  port: 8084

spring:
  application:
    name: payflow-payment-orchestrator
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# PaymentWorkflow connects to Temporal Server starting Milestone 1 — see docker-compose.yml.
temporal:
  target: localhost:7233

# Downstream services PaymentActivities calls synchronously (ARCHITECTURE_AND_PLAN.md §1.2).
payflow:
  orchestrator:
    provider-gateway-url: http://localhost:8083
    payment-command-url: http://localhost:8081
    ledger-url: http://localhost:8085
    notification-url: http://localhost:8086
